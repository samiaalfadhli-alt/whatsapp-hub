services:
  - type: web
    name: whatsapp-hub
    runtime: docker
    rootDir: whatsapp-hub
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/auth
    disk:
      name: whatsapp-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: PORT
        value: "3000"
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALERT_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: IMAP_HOST
        sync: false
      - key: IMAP_USER
        sync: false
      - key: IMAP_PASS
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
