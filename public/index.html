<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>WhatsApp Hub CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/app.css" />
</head>
<body>
<!-- شاشات الدخول والإعداد -->
<div id="auth-screen" class="auth hidden">
  <form id="login-form" class="auth-card">
    <div class="auth-logo"><span class="dot"></span> WhatsApp Hub</div>
    <h1>تسجيل الدخول</h1>
    <label>اسم المستخدم<input name="username" autocomplete="username" required /></label>
    <label>كلمة المرور<input name="password" type="password" autocomplete="current-password" required /></label>
    <button class="btn primary block" type="submit">دخول</button>
    <p class="form-error" data-error></p>
  </form>
  <form id="setup-form" class="auth-card hidden">
    <div class="auth-logo"><span class="dot"></span> WhatsApp Hub</div>
    <h1>الإعداد الأول</h1>
    <p class="muted">أنشئ حساب المدير العام (Super Admin)</p>
    <label>اسمك<input name="name" required /></label>
    <label>اسم المستخدم (إنجليزي)<input name="username" autocomplete="username" required /></label>
    <label>كلمة المرور (6 أحرف على الأقل)<input name="password" type="password" autocomplete="new-password" required /></label>
    <button class="btn primary block" type="submit">إنشاء وبدء الاستخدام</button>
    <p class="form-error" data-error></p>
  </form>
</div>

<!-- التطبيق -->
<div id="app" class="shell hidden">
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-brand"><span class="dot"></span><span>WhatsApp Hub</span><button class="icon-btn sidebar-close" data-close-nav aria-label="إغلاق">✕</button></div>
    <nav id="nav" class="nav"></nav>
    <div class="sidebar-foot">
      <div id="me" class="me"></div>
      <button id="btn-logout" class="icon-btn" title="تسجيل الخروج">⏻</button>
    </div>
  </aside>
  <div class="backdrop" data-close-nav></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="btn-nav" aria-label="القائمة">☰</button>
      <div class="search-wrap">
        <input id="global-search" type="search" placeholder="بحث سريع: اسم، جوال، شركة، وسم…" autocomplete="off" />
        <div id="search-results" class="search-results hidden"></div>
      </div>
      <div class="topbar-actions">
        <button id="btn-leads" class="icon-btn" title="الاستفسارات">🔔<span id="leads-badge" class="count hidden"></span></button>
        <button id="btn-add-contact" class="btn primary small">+ <span>إضافة عميل</span></button>
      </div>
    </header>
    <main id="view" class="view"></main>
  </div>
</div>

<div id="modal-root"></div>
<div id="drawer-root"></div>
<div id="toast-root" class="toasts"></div>
<div id="viewer" class="viewer hidden"><button class="viewer-close" aria-label="إغلاق">✕</button><img alt="" /></div>

<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
