<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WhatsApp Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="app.css" />
</head>
<body>
<div id="login" class="screen hidden">
  <form id="login-form" class="card">
    <h1>WhatsApp Hub</h1>
    <p class="muted">أدخل كلمة مرور لوحة التحكم</p>
    <input id="login-password" type="password" placeholder="كلمة المرور" autocomplete="current-password" />
    <button class="btn primary" type="submit">دخول</button>
    <p id="login-error" class="error"></p>
  </form>
</div>

<div id="app" class="layout hidden">
  <aside class="sidebar">
    <header class="sidebar-head">
      <div class="brand"><span class="dot"></span> WhatsApp Hub</div>
      <button id="btn-add" class="btn small">+ إضافة رقم</button>
    </header>

    <section class="accounts">
      <h2>الأرقام والمنصات</h2>
      <ul id="accounts-list"></ul>
    </section>

    <section class="chats-section">
      <div class="chats-head">
        <h2 id="chats-title">الصندوق الموحّد</h2>
        <input id="chat-search" type="search" placeholder="بحث في المحادثات" />
      </div>
      <ul id="chats-list"></ul>
    </section>
  </aside>

  <main class="main">
    <div id="empty" class="empty">
      <div class="empty-icon">💬</div>
      <p>اختر محادثة من القائمة أو ابدأ رسالة جديدة</p>
      <button id="btn-new-msg" class="btn">✉️ رسالة جديدة</button>
    </div>

    <div id="conversation" class="conversation hidden">
      <header class="conv-head">
        <div>
          <div id="conv-name" class="conv-name"></div>
          <div id="conv-meta" class="muted small-text"></div>
        </div>
      </header>
      <div id="messages" class="messages"></div>
      <form id="send-form" class="send-form">
        <textarea id="send-text" rows="1" placeholder="اكتب رسالة..." required></textarea>
        <button class="btn primary" type="submit">إرسال</button>
      </form>
    </div>
  </main>
</div>

<!-- نافذة إضافة رقم -->
<dialog id="add-dialog" class="dialog">
  <form id="add-form" method="dialog">
    <h2>إضافة رقم / منصة</h2>
    <label>الاسم التعريفي<input name="label" placeholder="مثال: خدمة العملاء، المبيعات" required /></label>
    <label>نوع الربط
      <select name="type" id="add-type">
        <option value="qr">واتساب عادي / بزنس — ربط عبر QR</option>
        <option value="cloud">WhatsApp Business Cloud API (Meta)</option>
      </select>
    </label>
    <div id="cloud-fields" class="hidden">
      <label>Phone Number ID<input name="phoneNumberId" /></label>
      <label>Access Token<input name="accessToken" type="password" /></label>
      <p class="muted small-text">أضف Webhook في Meta على: <code id="webhook-url"></code></p>
    </div>
    <div class="dialog-actions">
      <button class="btn" type="button" id="add-cancel">إلغاء</button>
      <button class="btn primary" type="submit">إضافة وربط</button>
    </div>
  </form>
</dialog>

<!-- نافذة QR -->
<dialog id="qr-dialog" class="dialog">
  <div class="qr-box">
    <h2 id="qr-title">امسح رمز QR</h2>
    <p class="muted small-text">واتساب ← الأجهزة المرتبطة ← ربط جهاز</p>
    <img id="qr-img" alt="QR" />
    <p id="qr-status" class="muted"></p>
    <button class="btn" id="qr-close" type="button">إغلاق</button>
  </div>
</dialog>

<!-- نافذة رسالة جديدة -->
<dialog id="new-dialog" class="dialog">
  <form id="new-form" method="dialog">
    <h2>رسالة جديدة</h2>
    <label>الإرسال من<select name="accountId" id="new-account"></select></label>
    <label>رقم المستلم (بالصيغة الدولية)<input name="to" placeholder="9665xxxxxxxx" required /></label>
    <label>الرسالة<textarea name="text" rows="3" required></textarea></label>
    <div class="dialog-actions">
      <button class="btn" type="button" id="new-cancel">إلغاء</button>
      <button class="btn primary" type="submit">إرسال</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast hidden"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
